<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מרחב אישי עברי - יומן חיים</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f19">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">

  <!-- ספריות Google Firebase הרשמיות -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- ספריית הצפנה מקומית תקנית (AES-256) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-surface: #131b2e;
      --bg-card: rgba(22, 33, 58, 0.7);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      --morning-accent: #f59e0b;
      --morning-bg: rgba(245, 158, 11, 0.12);
      --morning-border: rgba(245, 158, 11, 0.4);

      --noon-accent: #0284c7;
      --noon-bg: rgba(2, 132, 199, 0.15);
      --noon-border: rgba(56, 189, 248, 0.5);

      --evening-accent: #8b5cf6;
      --evening-bg: rgba(139, 92, 246, 0.16);
      --evening-border: rgba(167, 139, 250, 0.5);

      --color-holiday: #f43f5e;
      --color-fast: #ea580c;
      --color-memorial: #64748b;
      --color-celebration: #0d9488;
      --color-shabbat: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Assistant', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 1.4rem;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    .nav-tabs {
      display: flex;
      gap: 0.35rem;
      background: rgba(0, 0, 0, 0.35);
      padding: 0.3rem;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #1e293b;
      color: #38bdf8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .btn-action {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid var(--border-subtle);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-action:hover { background: #334155; }

    .btn-google {
      background: #ffffff;
      color: #1e293b;
      border: none;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-lock {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.3rem 0.65rem;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      font-size: 0.8rem;
    }

    .user-profile-badge img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    main {
      flex: 1;
      padding: 1.25rem;
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.25s ease-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 1. לוח יומי */
    .daily-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 900px) {
      .daily-grid { grid-template-columns: 1fr; }
    }

    .schedule-card {
      background: var(--bg-surface);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      padding: 1.25rem;
    }

    .schedule-card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .schedule-timeline {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 75vh;
      overflow-y: auto;
      padding-left: 0.5rem;
    }

    .slot-row {
      display: grid;
      grid-template-columns: 75px 85px 1fr;
      gap: 0.75rem;
      align-items: center;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      transition: background 0.15s ease;
    }

    .slot-row.morning {
      background: var(--morning-bg);
      border: 1px solid var(--morning-border);
      border-right: 4px solid var(--morning-accent);
    }
    .slot-row.morning .slot-tag { color: #fbbf24; background: rgba(245, 158, 11, 0.2); }

    .slot-row.noon {
      background: var(--noon-bg);
      border: 1px solid var(--noon-border);
      border-right: 4px solid var(--noon-accent);
    }
    .slot-row.noon .slot-tag { color: #38bdf8; background: rgba(2, 132, 199, 0.25); }

    .slot-row.evening {
      background: var(--evening-bg);
      border: 1px solid var(--evening-border);
      border-right: 4px solid var(--evening-accent);
    }
    .slot-row.evening .slot-tag { color: #c084fc; background: rgba(139, 92, 246, 0.25); }

    .slot-time { font-weight: 700; font-size: 0.95rem; color: #f8fafc; }
    .slot-tag { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 6px; text-align: center; }

    .slot-input {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      color: #f1f5f9;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }

    .slot-input:focus { border-color: #38bdf8; background: rgba(0, 0, 0, 0.45); }

    /* רשימות צ'קליסט ומטרות */
    .quick-list-card {
      background: var(--bg-surface);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .interactive-box h3 {
      font-size: 1.05rem;
      margin-bottom: 0.6rem;
      color: #cbd5e1;
    }

    .input-row { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }

    .fast-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .fast-input:focus { border-color: #38bdf8; }

    .btn-add {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .items-container {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      max-height: 240px;
      overflow-y: auto;
    }

    .item-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .item-chip:hover { background: rgba(255, 255, 255, 0.06); }

    .item-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #38bdf8;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-text {
      flex: 1;
      font-size: 0.92rem;
      transition: all 0.2s ease;
      user-select: none;
    }

    .item-chip.done {
      background: rgba(0, 0, 0, 0.25);
      border-color: rgba(255, 255, 255, 0.03);
    }

    .item-chip.done .item-text {
      text-decoration: line-through;
      color: #64748b;
      opacity: 0.7;
    }

    .btn-del {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem 0.4rem;
      opacity: 0.6;
    }

    .btn-del:hover { opacity: 1; }

    /* 2. לוח עברי */
    .calendar-container {
      background: var(--bg-surface);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      padding: 1.25rem;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .cal-nav-btn {
      background: #1e293b;
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .calendar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding: 0.5rem 0.75rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-size: 0.78rem;
    }

    .legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.45rem;
    }

    .day-header {
      text-align: center;
      font-weight: 700;
      padding: 0.4rem;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .day-cell {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      min-height: 95px;
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .day-cell.today {
      border: 1px solid #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    .day-numbers {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.8rem;
    }

    .greg-num { font-weight: 700; color: #f1f5f9; }

    .event-badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge-holiday { background: rgba(244, 63, 94, 0.25); color: #fda4af; border-right: 3px solid var(--color-holiday); }
    .badge-fast { background: rgba(234, 88, 12, 0.25); color: #fdba74; border-right: 3px solid var(--color-fast); }
    .badge-memorial { background: rgba(100, 116, 139, 0.35); color: #cbd5e1; border-right: 3px solid var(--color-memorial); }
    .badge-celebration { background: rgba(13, 148, 136, 0.25); color: #5eead4; border-right: 3px solid var(--color-celebration); }
    .badge-shabbat { background: rgba(79, 70, 229, 0.25); color: #a5b4fc; border-right: 3px solid var(--color-shabbat); }

    /* 3. תובנות ומסמכים */
    .insights-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 900px) {
      .insights-layout { grid-template-columns: 1fr; }
    }

    .editor-card {
      background: var(--bg-surface);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .rich-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.4rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .tool-btn {
      background: #1e293b;
      border: 1px solid var(--border-subtle);
      color: #f1f5f9;
      padding: 0.3rem 0.6rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
    }

    .tool-btn:hover { background: #334155; }

    .editor-area {
      min-height: 180px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.75rem;
      color: #f1f5f9;
      font-size: 0.95rem;
      outline: none;
      overflow-y: auto;
    }

    .external-doc-box {
      background: rgba(14, 165, 233, 0.08);
      border: 1px dashed rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .doc-launch-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0.5rem 0.85rem;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .insights-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      max-height: 75vh;
      overflow-y: auto;
    }

    .insight-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .insight-header { display: flex; justify-content: space-between; align-items: center; }
    .insight-title { font-weight: 700; font-size: 1.05rem; color: #38bdf8; }
    .insight-date { font-size: 0.78rem; color: #94a3b8; }
    .insight-body { font-size: 0.92rem; line-height: 1.5; color: #e2e8f0; }

    .insight-link-btn {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 1.6rem;">📖</span>
      <h1>מרחב אישי עברי</h1>
    </div>

    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('daily')">📅 סדר יום</button>
      <button class="tab-btn" onclick="switchTab('month')">🗓️ לוח עברי מורחב</button>
      <button class="tab-btn" onclick="switchTab('insights')">💡 תובנות ומסמכים</button>
    </nav>

    <div class="header-right">
      <!-- כפתור מפתח הצפנה פרטי -->
      <button class="btn-lock" onclick="promptEncryptionKey()" title="הגדרת סיסמת הצפנה פרטית להגנה מפני צפייה בענן">
        🔒 <span id="encStatusLabel">מפתח הצפנה</span>
      </button>

      <!-- כפתור כניסה Google -->
      <div id="authContainer">
        <button class="btn-google" id="btnLogin" onclick="loginGoogle()">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          התחבר עם Google
        </button>
      </div>

      <button class="btn-action" onclick="exportData()">💾 גיבוי</button>
      <label class="btn-action" style="cursor: pointer;">
        📂 שחזור
        <input type="file" id="importInput" style="display:none;" onchange="importData(event)">
      </label>
    </div>
  </header>

  <main>
    <!-- לשונית 1: לוח יומי -->
    <div id="tab-daily" class="tab-pane active">
      <div class="daily-grid">
        <div class="schedule-card">
          <h2>
            <span>לוח זמנים יומי</span>
            <span id="currentDateDisplay" style="font-size: 0.95rem; color: #94a3b8; font-weight: normal;"></span>
          </h2>
          <div class="schedule-timeline" id="timelineContainer"></div>
        </div>

        <div class="quick-list-card">
          <div class="interactive-box">
            <h3>🎯 מטרות היום <small style="font-size:0.75rem; color:#94a3b8;">(Enter להוספה)</small></h3>
            <div class="input-row">
              <input type="text" id="goalInput" class="fast-input" placeholder="מה המטרה הבאה?">
              <button class="btn-add" onclick="addGoal()">+</button>
            </div>
            <div class="items-container" id="goalsList"></div>
          </div>

          <hr style="border:0; border-top: 1px solid var(--border-subtle);">

          <div class="interactive-box">
            <h3>🌱 הרגלים יומיים <small style="font-size:0.75rem; color:#94a3b8;">(Enter להוספה)</small></h3>
            <div class="input-row">
              <input type="text" id="habitInput" class="fast-input" placeholder="הוסף הרגל חדש...">
              <button class="btn-add" onclick="addHabit()">+</button>
            </div>
            <div class="items-container" id="habitsList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- לשונית 2: לוח עברי -->
    <div id="tab-month" class="tab-pane">
      <div class="calendar-container">
        <div class="calendar-header">
          <button class="cal-nav-btn" onclick="changeMonth(-1)">▶ חודש קודם</button>
          <h2 id="calendarMonthTitle" style="font-size: 1.3rem;"></h2>
          <button class="cal-nav-btn" onclick="changeMonth(1)">חודש הבא ◀</button>
        </div>

        <div class="calendar-legend">
          <div class="legend-item"><div class="legend-dot" style="background: var(--color-holiday);"></div> חגי ישראל</div>
          <div class="legend-item"><div class="legend-dot" style="background: var(--color-fast);"></div> צומות ותעניות</div>
          <div class="legend-item"><div class="legend-dot" style="background: var(--color-memorial);"></div> ימי זיכרון וכיפור</div>
          <div class="legend-item"><div class="legend-dot" style="background: var(--color-celebration);"></div> מועדים ושמחות</div>
          <div class="legend-item"><div class="legend-dot" style="background: var(--color-shabbat);"></div> שבתות ופרשות</div>
        </div>

        <div class="month-grid" id="calendarDaysGrid"></div>
      </div>
    </div>

    <!-- לשונית 3: תובנות ומסמכים -->
    <div id="tab-insights" class="tab-pane">
      <div class="insights-layout">
        <div class="editor-card">
          <h2>💡 כתיבת תובנה / חידוש</h2>
          <input type="text" id="insightTitle" class="fast-input" placeholder="כותרת התובנה או הנושא...">
          
          <div class="rich-toolbar">
            <button class="tool-btn" onclick="formatDoc('bold')"><b>B</b></button>
            <button class="tool-btn" onclick="formatDoc('italic')"><i>I</i></button>
            <button class="tool-btn" onclick="formatDoc('underline')"><u>U</u></button>
            <button class="tool-btn" onclick="formatDoc('insertUnorderedList')">• רשימה</button>
            <input type="color" onchange="formatDoc('foreColor', this.value)" title="צבע טקסט" style="width:28px; height:26px; border:none; cursor:pointer; background:none;">
          </div>

          <div id="insightEditor" class="editor-area" contenteditable="true" placeholder="כתוב כאן את התובנה, הרעיון או החידוש..."></div>

          <div class="external-doc-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:700; font-size:0.88rem; color:#38bdf8;">📝 רוצה לכתוב מאמר או טקסט ארוך?</span>
              <button class="doc-launch-btn" onclick="window.open('https://docs.new', '_blank')">פתח Google Docs חדש ↗</button>
            </div>
            <input type="url" id="insightExternalUrl" class="fast-input" placeholder="הדבק כאן קישור למסמך החיצוני...">
          </div>

          <button class="btn-action" style="background:#0284c7; color:#fff; justify-content:center; padding:0.65rem;" onclick="saveInsight()">שמור תובנה במאגר</button>
        </div>

        <div class="insights-list" id="insightsContainer"></div>
      </div>
    </div>
  </main>

  <script>
    /* מפתחות Firebase שהגדרת בפרויקט */
    const firebaseConfig = {
      apiKey: "AIzaSyA1V94eeVVDcl4LRWpDaQlLY2F02cpe6B8",
      authDomain: "my-life-journal-3dcb6.firebaseapp.com",
      projectId: "my-life-journal-3dcb6",
      storageBucket: "my-life-journal-3dcb6.firebasestorage.app",
      messagingSenderId: "141093779961",
      appId: "1:141093779961:web:d2ab5826c949b75f3ee528"
    };

    let currentUser = null;
    let db = null;
    let auth = null;
    let isCloudConfigured = false;

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      isCloudConfigured = true;
    } catch (err) {
      console.warn("Firebase Init Error:", err);
    }

    const STORAGE_KEY = 'hebrew_life_journal_v8';
    const ENCRYPTION_KEY_STORAGE = 'hebrew_journal_enc_key';

    let state = {
      schedule: {},
      goals: [],
      habits: [],
      insights: [],
      currentMonth: new Date()
    };

    let encryptionKey = localStorage.getItem(ENCRYPTION_KEY_STORAGE) || '';

    window.addEventListener('DOMContentLoaded', () => {
      updateEncBadge();
      loadLocalState();
      initAuthListener();
      initScheduleView();
      initInputsKeydown();
      renderGoals();
      renderHabits();
      renderCalendar();
      renderInsights();
    });

    /* ================= מנגנון הצפנה מקומית (AES-256) ================= */
    function promptEncryptionKey() {
      const entered = prompt("הזן סיסמת הצפנה אישית (הסיסמה נשמרת רק במכשיר שלך ומצפינה את הנתונים לפני שליחתם לענן):", encryptionKey);
      if (entered !== null) {
        encryptionKey = entered.trim();
        if (encryptionKey) {
          localStorage.setItem(ENCRYPTION_KEY_STORAGE, encryptionKey);
        } else {
          localStorage.removeItem(ENCRYPTION_KEY_STORAGE);
        }
        updateEncBadge();
        syncStateToCloud();
      }
    }

    function updateEncBadge() {
      const label = document.getElementById('encStatusLabel');
      if (encryptionKey) {
        label.textContent = "מוצפן פרטית ✓";
        label.parentElement.style.borderColor = "#22c55e";
        label.parentElement.style.color = "#4ade80";
      } else {
        label.textContent = "ללא הצפנה";
        label.parentElement.style.borderColor = "rgba(245, 158, 11, 0.3)";
        label.parentElement.style.color = "#fbbf24";
      }
    }

    function encryptPayload(rawJson) {
      if (!encryptionKey) return rawJson;
      return CryptoJS.AES.encrypt(rawJson, encryptionKey).toString();
    }

    function decryptPayload(cipherText) {
      if (!encryptionKey) return cipherText;
      try {
        const bytes = CryptoJS.AES.decrypt(cipherText, encryptionKey);
        const originalText = bytes.toString(CryptoJS.enc.Utf8);
        return originalText || null;
      } catch (e) {
        return null;
      }
    }

    /* ================= סנכרון מאובטח לענן בזמן אמת ================= */
    function initAuthListener() {
      if (!isCloudConfigured || !auth) return;

      auth.onAuthStateChanged(user => {
        currentUser = user;
        renderAuthUI();
        if (user) {
          if (!encryptionKey) {
            promptEncryptionKey();
          }

          db.collection('users').doc(user.uid).onSnapshot(doc => {
            if (doc.exists) {
              const cloudDoc = doc.data();
              if (cloudDoc && cloudDoc.payload) {
                let decryptedJson = decryptPayload(cloudDoc.payload);
                if (decryptedJson) {
                  try {
                    state = Object.assign(state, JSON.parse(decryptedJson));
                    state.currentMonth = new Date(state.currentMonth || new Date());
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                    refreshAllViews();
                  } catch (e) {
                    console.error("JSON parse error:", e);
                  }
                } else if (encryptionKey) {
                  alert("שגיאת פענוח: סיסמת ההצפנה במכשיר זה אינה תואמת לסיסמה שבה הוצפנו הנתונים בענן.");
                }
              }
            } else {
              syncStateToCloud();
            }
          });
        }
      });
    }

    function syncStateToCloud() {
      if (isCloudConfigured && currentUser && db) {
        const jsonString = JSON.stringify(state);
        const encrypted = encryptPayload(jsonString);

        db.collection('users').doc(currentUser.uid).set({
          payload: encrypted,
          isEncrypted: !!encryptionKey,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error("Cloud Save Error:", err));
      }
    }

    function loginGoogle() {
      if (!isCloudConfigured) return;
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("שגיאה בהתחברות: " + err.message));
    }

    function logoutGoogle() {
      if (auth) auth.signOut();
    }

    function renderAuthUI() {
      const container = document.getElementById('authContainer');
      if (currentUser) {
        container.innerHTML = `
          <div class="user-profile-badge">
            <img src="${currentUser.photoURL || 'https://cdn-icons-png.flaticon.com/512/847/847969.png'}" alt="User">
            <span>${currentUser.displayName || currentUser.email}</span>
            <span style="color:#22c55e; font-size:0.75rem;">● מחובר</span>
            <button onclick="logoutGoogle()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.75rem; margin-right:4px;">התנתק</button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <button class="btn-google" onclick="loginGoogle()">
            <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            התחבר עם Google
          </button>
        `;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      syncStateToCloud();
    }

    function loadLocalState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = Object.assign(state, JSON.parse(saved));
          state.currentMonth = new Date(state.currentMonth || new Date());
        } catch (e) { console.error('Error loading state', e); }
      }
    }

    function refreshAllViews() {
      initScheduleView();
      renderGoals();
      renderHabits();
      renderInsights();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');

      if (tabId === 'month') renderCalendar();
    }

    /* 1. לו"ז יומי */
    function initScheduleView() {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';
      
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      for (let h = 6; h <= 23; h++) {
        const timeKey = `${String(h).padStart(2, '0')}:00`;
        let periodClass = 'morning';
        let periodLabel = 'בוקר 🌅';

        if (h >= 12 && h <= 17) {
          periodClass = 'noon';
          periodLabel = 'צהריים ☀️';
        } else if (h >= 18) {
          periodClass = 'evening';
          periodLabel = 'ערב/לילה 🌙';
        }

        const slotValue = (state.schedule[todayStr] && state.schedule[todayStr][timeKey]) || '';

        const row = document.createElement('div');
        row.className = `slot-row ${periodClass}`;
        row.innerHTML = `
          <div class="slot-time">${timeKey}</div>
          <div class="slot-tag">${periodLabel}</div>
          <input type="text" class="slot-input" value="${escapeHtml(slotValue)}" 
                 placeholder="הוסף משימה לשעה זו..." 
                 onchange="saveScheduleSlot('${todayStr}', '${timeKey}', this.value)">
        `;
        container.appendChild(row);
      }
    }

    function saveScheduleSlot(date, time, value) {
      if (!state.schedule[date]) state.schedule[date] = {};
      state.schedule[date][time] = value;
      saveState();
    }

    /* 2. מטרות והרגלים */
    function initInputsKeydown() {
      const goalInput = document.getElementById('goalInput');
      const habitInput = document.getElementById('habitInput');

      goalInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          addGoal();
        }
      });

      habitInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          addHabit();
        }
      });
    }

    function addGoal() {
      const input = document.getElementById('goalInput');
      const val = input.value.trim();
      if (!val) return;
      state.goals.push({ id: Date.now(), text: val, done: false });
      input.value = '';
      saveState();
      renderGoals();
    }

    function toggleGoal(id) {
      const g = state.goals.find(x => x.id === id);
      if (g) { g.done = !g.done; saveState(); renderGoals(); }
    }

    function deleteGoal(id, e) {
      e.stopPropagation();
      state.goals = state.goals.filter(x => x.id !== id);
      saveState();
      renderGoals();
    }

    function renderGoals() {
      const c = document.getElementById('goalsList');
      c.innerHTML = state.goals.map(g => `
        <div class="item-chip ${g.done ? 'done' : ''}" onclick="toggleGoal(${g.id})">
          <input type="checkbox" class="item-checkbox" ${g.done ? 'checked' : ''} onclick="event.stopPropagation(); toggleGoal(${g.id})">
          <span class="item-text">${escapeHtml(g.text)}</span>
          <button class="btn-del" title="מחק" onclick="deleteGoal(${g.id}, event)">✕</button>
        </div>
      `).join('');
    }

    function addHabit() {
      const input = document.getElementById('habitInput');
      const val = input.value.trim();
      if (!val) return;
      state.habits.push({ id: Date.now(), text: val, done: false });
      input.value = '';
      saveState();
      renderHabits();
    }

    function toggleHabit(id) {
      const h = state.habits.find(x => x.id === id);
      if (h) { h.done = !h.done; saveState(); renderHabits(); }
    }

    function deleteHabit(id, e) {
      e.stopPropagation();
      state.habits = state.habits.filter(x => x.id !== id);
      saveState();
      renderHabits();
    }

    function renderHabits() {
      const c = document.getElementById('habitsList');
      c.innerHTML = state.habits.map(h => `
        <div class="item-chip ${h.done ? 'done' : ''}" onclick="toggleHabit(${h.id})">
          <input type="checkbox" class="item-checkbox" ${h.done ? 'checked' : ''} onclick="event.stopPropagation(); toggleHabit(${h.id})">
          <span class="item-text">${escapeHtml(h.text)}</span>
          <button class="btn-del" title="מחק" onclick="deleteHabit(${h.id}, event)">✕</button>
        </div>
      `).join('');
    }

    /* 3. לוח עברי */
    let hebcalEventsCache = {};

    async function fetchHebcalEvents(year, month) {
      const key = `${year}-${month}`;
      if (hebcalEventsCache[key]) return hebcalEventsCache[key];

      try {
        const res = await fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&mod=on&nx=on&year=${year}&month=${month}&ss=on&mf=on&c=on&geo=pos&latitude=31.7683&longitude=35.2137&tzid=Asia/Jerusalem`);
        const data = await res.json();
        hebcalEventsCache[key] = data.items || [];
        return hebcalEventsCache[key];
      } catch (e) { return []; }
    }

    function getEventBadgeClass(title) {
      const t = title.toLowerCase();
      if (t.includes('צום') || t.includes('תענית') || t.includes('עשרה בטבת') || t.includes('אסתר') || t.includes('תמוז') || t.includes('אב')) return 'badge-fast';
      if (t.includes('זיכרון') || t.includes('שואה') || t.includes('כיפור')) return 'badge-memorial';
      if (t.includes('ראש השנה') || t.includes('פסח') || t.includes('סוכות') || t.includes('שבועות') || t.includes('שמחת תורה')) return 'badge-holiday';
      if (t.includes('עצמאות') || t.includes('פורים') || t.includes('חנוכה') || t.includes('ירושלים') || t.includes('ל״ג בעומר') || t.includes('חודש')) return 'badge-celebration';
      return 'badge-shabbat';
    }

    async function renderCalendar() {
      const curr = state.currentMonth;
      const year = curr.getFullYear();
      const month = curr.getMonth();

      document.getElementById('calendarMonthTitle').textContent = curr.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
      const events = await fetchHebcalEvents(year, month + 1);

      const grid = document.getElementById('calendarDaysGrid');
      grid.innerHTML = '';

      ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'שבת'].forEach(d => {
        grid.innerHTML += `<div class="day-header">${d}</div>`;
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split('T')[0];

      for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;

        const dayEvents = events.filter(e => e.date && e.date.startsWith(dateStr));
        let eventsHtml = '';
        dayEvents.forEach(e => {
          const badgeClass = getEventBadgeClass(e.hebrew || e.title);
          eventsHtml += `<div class="event-badge ${badgeClass}" title="${e.hebrew || e.title}">${e.hebrew || e.title}</div>`;
        });

        grid.innerHTML += `
          <div class="day-cell ${isToday ? 'today' : ''}">
            <div class="day-numbers"><span class="greg-num">${day}</span></div>
            ${eventsHtml}
          </div>
        `;
      }
    }

    function changeMonth(delta) {
      state.currentMonth.setMonth(state.currentMonth.getMonth() + delta);
      renderCalendar();
    }

    /* 4. תובנות ומסמכים */
    function formatDoc(cmd, value = null) {
      document.execCommand(cmd, false, value);
    }

    function saveInsight() {
      const titleInput = document.getElementById('insightTitle');
      const editor = document.getElementById('insightEditor');
      const urlInput = document.getElementById('insightExternalUrl');

      const title = titleInput.value.trim() || 'תובנה ללא שם';
      const body = editor.innerHTML.trim();
      const extUrl = urlInput.value.trim();

      if (!body && !extUrl) return;

      state.insights.unshift({
        id: Date.now(),
        title,
        body,
        externalUrl: extUrl,
        date: new Date().toLocaleDateString('he-IL')
      });

      titleInput.value = '';
      editor.innerHTML = '';
      urlInput.value = '';

      saveState();
      renderInsights();
    }

    function deleteInsight(id) {
      state.insights = state.insights.filter(x => x.id !== id);
      saveState();
      renderInsights();
    }

    function renderInsights() {
      const c = document.getElementById('insightsContainer');
      if (state.insights.length === 0) {
        c.innerHTML = '<div style="color:#64748b; text-align:center; padding:2rem;">עדיין אין תובנות שמורות. כתוב תובנה חדשה מימין!</div>';
        return;
      }

      c.innerHTML = state.insights.map(item => `
        <div class="insight-card">
          <div class="insight-header">
            <span class="insight-title">${escapeHtml(item.title)}</span>
            <div style="display:flex; align-items:center; gap:0.5rem;">
              <span class="insight-date">${item.date}</span>
              <button class="btn-del" onclick="deleteInsight(${item.id})">✕</button>
            </div>
          </div>
          <div class="insight-body">${item.body}</div>
          ${item.externalUrl ? `
            <a href="${item.externalUrl}" target="_blank" class="insight-link-btn">
              🔗 פתח מסמך מורחב (Google Docs / חיצוני) ↗
            </a>
          ` : ''}
        </div>
      `).join('');
    }

    /* 5. גיבוי ושחזור */
    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `journal-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const loaded = JSON.parse(event.target.result);
          state = Object.assign(state, loaded);
          state.currentMonth = new Date();
          saveState();
          location.reload();
        } catch (err) { alert('שגיאה בטעינת קובץ הגיבוי'); }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
